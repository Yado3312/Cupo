services:
  cupo:
    build: .
    image: cupo:local
    init: true
    restart: unless-stopped
    ports:
      - "${CUPO_PORT:-3000}:3001"
    environment:
      API_PORT: "3001"
      ROBOFLOW_API_KEY: "${ROBOFLOW_API_KEY:-}"
      ROBOFLOW_WORKSPACE: "${ROBOFLOW_WORKSPACE:-martinalan471-s-workspace}"
      ROBOFLOW_WORKFLOW_ID: "${ROBOFLOW_WORKFLOW_ID:-cupo}"
      ROBOFLOW_WORKFLOW_IMAGE_INPUT: "${ROBOFLOW_WORKFLOW_IMAGE_INPUT:-image}"